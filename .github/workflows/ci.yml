name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @morrow/orchestrator benchmark:startup --check
      - run: pnpm --filter @morrow/orchestrator benchmark:query-plans
      # Repository-level guards (installer data-safety, version drift, installer
      # ASCII/UTF-8). pnpm check runs the validator on the real files; this also
      # exercises the negative cases so the guards can't silently rot.
      # installer-cli-only proves no browser, no localhost, no web/index.html.
      # install-activation drives the real atomic activation/rollback code paths.
      # install-sh does the same for the macOS/Linux installer, plus its health
      # gate — the check that decides whether an install is kept or rolled back.
      # It runs here rather than only on Windows because the runner is Linux.
      - run: node --test scripts/validate-repository.test.mjs scripts/installer-cli-only.test.mjs scripts/install-activation.test.mjs scripts/install-sh.test.mjs scripts/lib/package-provenance.test.mjs scripts/package-release.test.mjs scripts/release-artifacts.test.mjs scripts/acceptance-foundation-smoke.test.mjs scripts/check-branch-freshness.test.mjs scripts/release-tag-integrity.test.mjs scripts/public-install-verifier.test.mjs scripts/release-workflow.test.mjs
      # Where the one claim that matters actually stands, printed on every
      # build: "give Morrow a real task and it finishes correctly, every time."
      # Reporting, not enforcing, until the first real-provider runs are
      # recorded — see docs/evidence/README.md. It exits 0 either way.
      - run: pnpm flagship:gate

  branch-freshness:
    name: Branch freshness
    runs-on: ubuntu-latest
    # A branch that diverges from the integration line for weeks is how Morrow
    # silently unified two unrelated functions that shared a name, and how a
    # beta.34 fix was lost in a later merge. Neither was visible in a diff.
    # fetch-depth: 0 because the guard needs the merge-base and both tips.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node scripts/check-branch-freshness.mjs
